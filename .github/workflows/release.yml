name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.12.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches plugin version
        shell: bash
        run: |
          VERSION="$(node -p "require('./plugin.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag version ($TAG) does not match plugin.json version ($VERSION)."
            exit 1
          fi

      - name: Build package
        run: pnpm run release:package

      - name: Prepare release notes
        shell: bash
        run: |
          node scripts/changelog.js extract "$GITHUB_REF_NAME" release-notes.md
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          if [ -n "$PREVIOUS_TAG" ]; then
            printf '\n[查看完整变更](https://github.com/%s/compare/%s...%s)\n' \
              "$GITHUB_REPOSITORY" "$PREVIOUS_TAG" "$GITHUB_REF_NAME" >> release-notes.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" package.zip \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --latest
