name: 功能建议
description: 提议新的使用能力或改进现有工作流
title: "feat: "
labels:
    - enhancement
body:
    - type: checkboxes
      id: preflight
      attributes:
          label: 提交前检查
          options:
              - label: 我已搜索现有 Issue，确认没有相同或高度相似的建议。
                required: true

    - type: textarea
      id: problem
      attributes:
          label: 要解决的问题
          description: 请描述真实使用场景、当前阻碍，以及谁会从中受益。
      validations:
          required: true

    - type: textarea
      id: proposal
      attributes:
          label: 建议方案
          description: 描述期望的交互或结果，不必提前设计所有实现细节。
      validations:
          required: true

    - type: textarea
      id: alternatives
      attributes:
          label: 已尝试的替代方案
          description: 当前如何绕过这个问题？为什么仍然不够？

    - type: textarea
      id: scope
      attributes:
          label: 范围与边界
          description: 哪些内容应该包含，哪些内容明确不需要？

    - type: textarea
      id: additional
      attributes:
          label: 补充材料
          description: 可附界面草图、示例数据或相关 Issue 链接；请先移除隐私信息。
